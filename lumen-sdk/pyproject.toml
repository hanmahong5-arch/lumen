[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumen-ai"
version = "0.2.1"
description = "Developer tools for AI agent reliability — replay, cost tracking, crash recovery"
# Kept as a copy of the repo-root README: a "../README.md" reference leaks a
# path-traversal member into the sdist, which PEP 706 extraction filters reject.
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]
keywords = ["ai", "agent", "observability", "reliability", "llm", "langchain", "langgraph", "developer-tools", "cost-tracking", "replay"]
authors = [
    { name = "Lumen Contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
langgraph = ["langgraph-checkpoint>=2.0,<5.0", "langchain-core>=0.3,<1.0"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
all = ["openai>=1.0", "anthropic>=0.40", "langgraph-checkpoint>=2.0,<5.0", "langchain-core>=0.3,<1.0"]
dev = ["pytest>=8.0", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/hanmahong5-arch/lumen"
Documentation = "https://github.com/hanmahong5-arch/lumen#readme"
Repository = "https://github.com/hanmahong5-arch/lumen"
Issues = "https://github.com/hanmahong5-arch/lumen/issues"

[tool.hatch.build.targets.wheel]
packages = ["lumen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
