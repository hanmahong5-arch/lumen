name: Publish lumen-sdk to PyPI

# Trusted Publishing (OIDC) — one-time setup on https://pypi.org :
#   Pending publisher → Project: lumen-ai
#   Owner: hanmahong5-arch  Repo: lumen
#   Workflow: publish-lumen-sdk.yaml  Environment: pypi
# See docs/RELEASE.md. Do not cut a shared vX.Y.Z tag until that is configured
# and lumen-sdk/pyproject.toml version matches the tag.

on:
  push:
    tags:
      - "lumen-sdk-v*"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: lumen-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest (must pass before publish)
        run: python -m pytest -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      # workflow_dispatch is build+check only — never upload without a tag.
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: lumen-sdk/dist
