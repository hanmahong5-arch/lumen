<svg viewBox="0 0 1188 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lumen-architecture-title lumen-architecture-desc">
  <title id="lumen-architecture-title">Lumen's two-stage SDK-to-CLI trace pipeline</title>
  <desc id="lumen-architecture-desc">Diagram showing Lumen's two-stage architecture: your code calls its own LLM provider while the Python SDK writes trace JSON to disk for the embedded Rust core and CLI to read for replay, cost, and dashboard rendering, with Lumen never calling the LLM provider itself.</desc>
  <defs>
    <marker id="arr-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3D3B33"/></marker>
    <marker id="arr-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#FF5D1F"/></marker>
    <marker id="arr-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2D4A8A"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#F5F2E8"/>

  <!-- ===================== ANNOTATION CALLOUT ===================== -->
  <path d="M 376,46 Q 280,58 170,64" fill="none" stroke="rgba(20,19,15,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="170" cy="64" r="2" fill="#14130F"/>
  <text x="380" y="40" fill="#14130F" font-size="14" font-style="italic" font-family="'Fraunces','Iowan Old Style','Times New Roman',serif" text-anchor="end">never called by Lumen</text>

  <!-- ===================== ARROWS (drawn before nodes) ===================== -->
  <!-- Arrow 1: Your Agent Code -> LLM Provider (vertical, link/external call) -->
  <line x1="120" y1="232" x2="120" y2="128" stroke="#2D4A8A" stroke-width="1.2" marker-end="url(#arr-link)"/>
  <rect x="126" y="174" width="68" height="12" rx="2" fill="#F5F2E8"/>
  <text x="160" y="183" fill="#2D4A8A" font-size="8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" text-anchor="middle" letter-spacing="0.06em">API CALLS</text>

  <!-- Arrow 2: Your Agent Code -> Lumen SDK (instrument patch) -->
  <line x1="200" y1="264" x2="280" y2="264" stroke="#3D3B33" stroke-width="1" marker-end="url(#arr-muted)"/>
  <rect x="216" y="244" width="48" height="12" rx="2" fill="#F5F2E8"/>
  <text x="240" y="253" fill="#3D3B33" font-size="8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" text-anchor="middle" letter-spacing="0.06em">PATCHES</text>

  <!-- Arrow 3: Lumen SDK -> Trace JSON (FOCAL write) -->
  <line x1="440" y1="264" x2="520" y2="264" stroke="#FF5D1F" stroke-width="1.4" marker-end="url(#arr-accent)"/>
  <rect x="450" y="244" width="60" height="12" rx="2" fill="#F5F2E8"/>
  <text x="480" y="253" fill="#FF5D1F" font-size="8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" text-anchor="middle" letter-spacing="0.06em">WRITE JSON</text>

  <!-- Arrow 4: Trace JSON -> Lumen Core (read) -->
  <line x1="680" y1="264" x2="760" y2="264" stroke="#3D3B33" stroke-width="1" marker-end="url(#arr-muted)"/>
  <rect x="692" y="244" width="56" height="12" rx="2" fill="#F5F2E8"/>
  <text x="720" y="253" fill="#3D3B33" font-size="8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" text-anchor="middle" letter-spacing="0.06em">READ JSON</text>

  <!-- Arrow 5: Lumen Core -> Lumen CLI (same binary, no HTTP) -->
  <line x1="920" y1="264" x2="1000" y2="264" stroke="#3D3B33" stroke-width="1" marker-end="url(#arr-muted)"/>
  <rect x="936" y="244" width="48" height="12" rx="2" fill="#F5F2E8"/>
  <text x="960" y="253" fill="#3D3B33" font-size="8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" text-anchor="middle" letter-spacing="0.06em">NO HTTP</text>

  <!-- Arrow 6: Lumen CLI -> Kova + Netdata (optional, dashed) -->
  <line x1="1080" y1="296" x2="1080" y2="400" stroke="#3D3B33" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>
  <rect x="1086" y="342" width="56" height="12" rx="2" fill="#F5F2E8"/>
  <text x="1114" y="351" fill="#3D3B33" font-size="8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" text-anchor="middle" letter-spacing="0.06em">OPTIONAL</text>

  <!-- ===================== NODES ===================== -->

  <!-- LLM Provider (external) -->
  <rect x="40" y="64" width="160" height="64" rx="6" fill="#F5F2E8"/>
  <rect x="40" y="64" width="160" height="64" rx="6" fill="rgba(20,19,15,0.03)" stroke="rgba(20,19,15,0.30)" stroke-width="1"/>
  <rect x="48" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(20,19,15,0.30)" stroke-width="0.8"/>
  <text x="64" y="81" fill="#6B6860" font-size="7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
  <text x="120" y="100" fill="#14130F" font-size="12" font-weight="600" font-family="'Inter Tight','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">LLM Provider</text>
  <text x="120" y="116" fill="#3D3B33" font-size="9" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" text-anchor="middle">OpenAI &#183; Anthropic APIs</text>

  <!-- Your Agent Code (input / user) -->
  <rect x="40" y="232" width="160" height="64" rx="6" fill="#F5F2E8"/>
  <rect x="40" y="232" width="160" height="64" rx="6" fill="rgba(61,59,51,0.10)" stroke="#6B6860" stroke-width="1"/>
  <rect x="48" y="240" width="32" height="12" rx="2" fill="transparent" stroke="#6B6860" stroke-width="0.8"/>
  <text x="64" y="249" fill="#6B6860" font-size="7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="120" y="268" fill="#14130F" font-size="12" font-weight="600" font-family="'Inter Tight','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">Your Agent Code</text>
  <text x="120" y="284" fill="#3D3B33" font-size="9" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" text-anchor="middle">OpenAI &#183; Anthropic SDKs</text>

  <!-- Lumen SDK (backend, Python) -->
  <rect x="280" y="232" width="160" height="64" rx="6" fill="#F5F2E8"/>
  <rect x="280" y="232" width="160" height="64" rx="6" fill="#FFFFFF" stroke="#14130F" stroke-width="1"/>
  <rect x="288" y="240" width="32" height="12" rx="2" fill="transparent" stroke="#14130F" stroke-width="0.8"/>
  <text x="304" y="249" fill="#6B6860" font-size="7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">SDK</text>
  <text x="360" y="268" fill="#14130F" font-size="12" font-weight="600" font-family="'Inter Tight','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">Lumen SDK</text>
  <text x="360" y="284" fill="#3D3B33" font-size="9" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" text-anchor="middle">instrument() &#183; Python SDK</text>

  <!-- Trace JSON (store, FOCAL) -->
  <rect x="520" y="232" width="160" height="64" rx="6" fill="#F5F2E8"/>
  <rect x="520" y="232" width="160" height="64" rx="6" fill="rgba(255,93,31,0.08)" stroke="#FF5D1F" stroke-width="1"/>
  <rect x="528" y="240" width="32" height="12" rx="2" fill="transparent" stroke="rgba(255,93,31,0.50)" stroke-width="0.8"/>
  <text x="544" y="249" fill="#FF5D1F" font-size="7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="600" y="268" fill="#14130F" font-size="12" font-weight="600" font-family="'Inter Tight','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">Trace JSON</text>
  <text x="600" y="284" fill="#3D3B33" font-size="9" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" text-anchor="middle">on disk &#183; LUMEN_TRACE_DIR</text>

  <!-- Lumen Core (backend, Rust engine) -->
  <rect x="760" y="232" width="160" height="64" rx="6" fill="#F5F2E8"/>
  <rect x="760" y="232" width="160" height="64" rx="6" fill="#FFFFFF" stroke="#14130F" stroke-width="1"/>
  <rect x="768" y="240" width="32" height="12" rx="2" fill="transparent" stroke="#14130F" stroke-width="0.8"/>
  <text x="784" y="249" fill="#6B6860" font-size="7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
  <text x="840" y="268" fill="#14130F" font-size="12" font-weight="600" font-family="'Inter Tight','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">Lumen Core</text>
  <text x="840" y="284" fill="#3D3B33" font-size="9" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" text-anchor="middle">embedded in CLI &#183; no HTTP</text>

  <!-- Lumen CLI (backend, Rust CLI + dashboard) -->
  <rect x="1000" y="232" width="160" height="64" rx="6" fill="#F5F2E8"/>
  <rect x="1000" y="232" width="160" height="64" rx="6" fill="#FFFFFF" stroke="#14130F" stroke-width="1"/>
  <rect x="1008" y="240" width="32" height="12" rx="2" fill="transparent" stroke="#14130F" stroke-width="0.8"/>
  <text x="1024" y="249" fill="#6B6860" font-size="7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
  <text x="1080" y="268" fill="#14130F" font-size="12" font-weight="600" font-family="'Inter Tight','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">Lumen CLI</text>
  <text x="1080" y="284" fill="#3D3B33" font-size="9" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" text-anchor="middle">replay &#183; cost &#183; dashboard</text>

  <!-- Kova + Netdata (optional external) -->
  <rect x="1000" y="400" width="160" height="64" rx="6" fill="#F5F2E8"/>
  <rect x="1000" y="400" width="160" height="64" rx="6" fill="rgba(20,19,15,0.02)" stroke="rgba(20,19,15,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="1008" y="408" width="32" height="12" rx="2" fill="transparent" stroke="rgba(20,19,15,0.20)" stroke-width="0.8"/>
  <text x="1024" y="417" fill="#6B6860" font-size="7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">OPT</text>
  <text x="1080" y="436" fill="#14130F" font-size="12" font-weight="600" font-family="'Inter Tight','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">Kova + Netdata</text>
  <text x="1080" y="452" fill="#3D3B33" font-size="9" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" text-anchor="middle">metrics &#183; terminal tab</text>

  <!-- ===================== LEGEND ===================== -->
  <line x1="40" y1="496" x2="1148" y2="496" stroke="rgba(20,19,15,0.12)" stroke-width="0.8"/>
  <text x="40" y="512" fill="#3D3B33" font-size="8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" letter-spacing="0.16em">LEGEND</text>

  <rect x="40" y="520" width="14" height="10" rx="2" fill="rgba(61,59,51,0.10)" stroke="#6B6860" stroke-width="1"/>
  <text x="60" y="529" fill="#3D3B33" font-size="8.5" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif">Your code</text>

  <rect x="200" y="520" width="14" height="10" rx="2" fill="rgba(20,19,15,0.03)" stroke="rgba(20,19,15,0.30)" stroke-width="1"/>
  <text x="220" y="529" fill="#3D3B33" font-size="8.5" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif">External API</text>

  <rect x="360" y="520" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#14130F" stroke-width="1"/>
  <text x="380" y="529" fill="#3D3B33" font-size="8.5" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif">Lumen component</text>

  <rect x="560" y="520" width="14" height="10" rx="2" fill="rgba(255,93,31,0.08)" stroke="#FF5D1F" stroke-width="1"/>
  <text x="580" y="529" fill="#3D3B33" font-size="8.5" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif">Focal &#183; trace file</text>

  <rect x="760" y="520" width="14" height="10" rx="2" fill="rgba(20,19,15,0.02)" stroke="rgba(20,19,15,0.20)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="780" y="529" fill="#3D3B33" font-size="8.5" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif">Optional</text>

  <line x1="40" y1="552" x2="68" y2="552" stroke="#3D3B33" stroke-width="1" marker-end="url(#arr-muted)"/>
  <text x="76" y="555" fill="#3D3B33" font-size="8.5" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif">Internal call</text>

  <line x1="300" y1="552" x2="328" y2="552" stroke="#2D4A8A" stroke-width="1.2" marker-end="url(#arr-link)"/>
  <text x="336" y="555" fill="#3D3B33" font-size="8.5" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif">LLM API call</text>

  <line x1="580" y1="552" x2="608" y2="552" stroke="#FF5D1F" stroke-width="1.4" marker-end="url(#arr-accent)"/>
  <text x="616" y="555" fill="#3D3B33" font-size="8.5" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif">Writes trace (focal)</text>

  <line x1="900" y1="552" x2="928" y2="552" stroke="#3D3B33" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-muted)"/>
  <text x="936" y="555" fill="#3D3B33" font-size="8.5" font-family="'Inter Tight','Helvetica Neue',Arial,sans-serif">Optional path</text>
</svg>
