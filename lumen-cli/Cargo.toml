[package]
name = "lumen-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for Lumen — illuminate your AI agents"

[[bin]]
name = "lumen"
path = "src/main.rs"

[dependencies]
lumen-core = { path = "../lumen-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
# Minimal synchronous HTTP client for `lumen pull` (fetch traces from a running
# Kova). ureq is sync + small (no tokio); kept out of lumen-core so the engine
# stays dependency-light. Default features use rustls (no native OpenSSL).
ureq = "2"

[lints]
workspace = true
