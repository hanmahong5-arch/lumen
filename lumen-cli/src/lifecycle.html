<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen · lifecycle __RUN_ID__</title>
<style>
  :root{
    --bg:#0a0c12; --panel:#12161f; --panel2:#171c28; --border:#1f2533; --border2:#2a3145;
    --fg:#e6e9ef; --muted:#7c8699; --grad1:#5b9dff; --grad2:#a855f7;
    --llm:#3b82f6; --tool:#8b5cf6; --wait:#64748b; --workflow:#22d3ee; --swarm:#f59e0b;
    --recovery:#ec4899; --ok:#22c55e; --err:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:18px 26px;border-bottom:1px solid var(--border);
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header .brand{font-weight:800;font-size:19px;
    background:linear-gradient(90deg,var(--grad1),var(--grad2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  header .tag{color:var(--muted);font-size:12px}
  header .runid{margin-left:auto;color:var(--muted);font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .wrap{padding:22px 26px;max-width:1180px;margin:0 auto}
  .section-title{font-weight:700;font-size:12px;letter-spacing:.6px;text-transform:uppercase;
    color:var(--muted);margin:26px 0 10px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
  .card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;min-width:108px}
  .card .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
  .card .v{font-weight:800;font-size:18px;margin-top:2px}
  .empty{color:var(--muted);padding:18px;text-align:center;background:var(--panel2);
    border:1px dashed var(--border2);border-radius:10px}
  footer{padding:18px 26px;color:var(--muted);font-size:11px;border-top:1px solid var(--border);margin-top:30px}
  a{color:var(--grad1)}

  /* ── elegance layer (offline-safe: motion, depth, quiet scrollbars) ──────
     Additive polish; self-contained (no CDN/external refs) so the exported
     single file still opens anywhere. Mirrors the live dashboard's feel. */
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion: no-preference){
    .card,.panel{transition:transform .18s cubic-bezier(.2,.7,.2,1),box-shadow .2s ease,border-color .16s ease}
  }
  .card:hover{transform:translateY(-2px);border-color:var(--border2);box-shadow:0 10px 26px rgba(0,0,0,.30)}
  header .brand{filter:drop-shadow(0 0 14px rgba(122,140,255,.32))}
  *{scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  *::-webkit-scrollbar-thumb:hover{background:var(--muted)}
  @media (max-width:640px){.wrap{padding:16px 14px}}
</style>
</head>
<body>
<header>
  <span class="brand">Lumen.</span>
  <span class="tag">agent lifecycle</span>
  <span class="runid">run __RUN_ID__ · self-contained · opens offline</span>
</header>
<div class="wrap" id="root"><div class="empty">Rendering lifecycle…</div></div>
<footer>Generated by <b>lumen export</b> — a single self-contained file (no server, no CDN). Open it anywhere.</footer>

</html>
