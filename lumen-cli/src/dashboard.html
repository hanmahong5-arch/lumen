<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lumen — Agent Observability</title>
<style>
  :root {
    --bg: #0a0c12; --bg2: #0d1018; --panel: #12161f; --panel2: #171c28; --border: #1f2533;
    --border2: #2a3145; --text: #d3dbe8; --muted: #6b7689; --muted2: #4a5266;
    --accent: #5b9dff; --accent2: #a855f7;
    --llm: #3b82f6; --tool: #8b5cf6; --ckpt: #64748b; --err: #ef4444;
    --ok: #22c55e; --warn: #f59e0b; --recover: #a855f7; --cyan: #22d3ee;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 80% -10%, #131a2e 0%, var(--bg) 55%);
    color: var(--text); font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .grad { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  header { display: flex; align-items: center; gap: 18px; padding: 13px 22px; border-bottom: 1px solid var(--border); background: rgba(13,16,24,.7); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 30; }
  .brand { font-weight: 800; font-size: 17px; letter-spacing: .2px; }
  .tag { color: var(--muted); font-size: 12px; }
  nav.tabs { display: flex; gap: 4px; margin-left: 8px; }
  nav.tabs button { background: none; border: none; color: var(--muted); font: inherit; font-weight: 600; padding: 6px 13px; border-radius: 8px; cursor: pointer; }
  nav.tabs button:hover { color: var(--text); background: var(--panel); }
  nav.tabs button.on { color: #fff; background: linear-gradient(90deg, rgba(91,157,255,.18), rgba(168,85,247,.18)); box-shadow: inset 0 0 0 1px var(--border2); }
  .hstats { margin-left: auto; display: flex; gap: 22px; align-items: center; }
  .hstat .v { font-weight: 800; font-size: 15px; } .hstat .k { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; }
  .live { display: flex; align-items: center; gap: 7px; color: var(--muted); cursor: pointer; user-select: none; font-size: 12px; }
  .live .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: pulse 2s infinite; }
  .live.off .pulse { background: var(--muted2); animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.5);} 70% { box-shadow: 0 0 0 7px rgba(34,197,94,0);} 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0);} }

  .wrap { padding: 22px 26px; max-width: 1500px; margin: 0 auto; }

  /* KPI cards */
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 13px; margin-bottom: 20px; }
  .kpi { background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--border); border-radius: 13px; padding: 14px 16px; position: relative; overflow: hidden; }
  .kpi::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: .7; }
  .kpi .k { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; }
  .kpi .v { font-weight: 800; font-size: 24px; margin-top: 5px; letter-spacing: -.5px; }
  .kpi .d { color: var(--muted); font-size: 11px; margin-top: 2px; }

  /* chart grid */
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 15px; }
  .col-4 { grid-column: span 4; } .col-6 { grid-column: span 6; } .col-8 { grid-column: span 8; } .col-12 { grid-column: span 12; }
  .panel { background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--border); border-radius: 13px; padding: 16px 18px; }
  .panel h3 { margin: 0 0 14px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .panel h3 .hint { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted2); margin-left: auto; }

  /* horizontal bars */
  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 64px; gap: 10px; align-items: center; }
  .bar-row .bl { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .bar-track { background: var(--bg); border-radius: 6px; height: 22px; position: relative; overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
  .bar-fill { height: 100%; border-radius: 6px; min-width: 2px; }
  .bar-fill.stack { display: flex; }
  .bar-fill.stack span { height: 100%; }
  .bar-val { color: var(--muted); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; }

  /* donut */
  .donut-wrap { display: flex; align-items: center; gap: 18px; }
  .donut-c { position: relative; flex: none; }
  .donut-c .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut-c .center .n { font-weight: 800; font-size: 19px; } .donut-c .center .l { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
  .legend { display: flex; flex-direction: column; gap: 7px; }
  .legend .lg { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .legend .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .legend .lv { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* traces view */
  .tview { display: grid; grid-template-columns: 310px 1fr; gap: 16px; }
  .sidebar { background: var(--panel); border: 1px solid var(--border); border-radius: 13px; overflow: hidden; align-self: start; }
  .sb-head { padding: 11px 15px; color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
  .sb-head input { margin-left: auto; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 4px 9px; font: inherit; font-size: 12px; width: 120px; }
  .trace-item { padding: 11px 15px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .trace-item:last-child { border-bottom: none; }
  .trace-item:hover { background: var(--panel2); }
  .trace-item.sel { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
  .trace-item .top { display: flex; align-items: center; gap: 8px; }
  .trace-item .sdot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .trace-item .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trace-item .meta { color: var(--muted); font-size: 11.5px; margin-top: 3px; display: flex; gap: 10px; }
  .trace-item .recover { color: var(--recover); }

  .detail { min-width: 0; }
  h2.tid { font-size: 14px; font-weight: 700; margin: 0 0 2px; word-break: break-all; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 11px; margin-bottom: 15px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 11px; padding: 11px 14px; }
  .card .k { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; }
  .card .v { font-weight: 800; font-size: 18px; margin-top: 4px; } .card .v2 { color: var(--muted); font-size: 11px; margin-top: 3px; }

  .recover-banner { display: flex; gap: 10px; background: linear-gradient(90deg, rgba(168,85,247,.14), rgba(168,85,247,.04)); border: 1px solid rgba(168,85,247,.4); color: #e9d5ff; border-radius: 11px; padding: 11px 15px; margin-bottom: 15px; }
  .recover-banner b { color: #fff; }

  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 20px 0 10px; }

  /* timeline */
  .tl { background: var(--panel); border: 1px solid var(--border); border-radius: 13px; padding: 16px 18px 8px; }
  .ruler { position: relative; height: 16px; margin-left: 176px; border-bottom: 1px dashed var(--border2); margin-bottom: 9px; }
  .ruler .tick { position: absolute; top: 0; transform: translateX(-50%); color: var(--muted); font-size: 10px; }
  .ruler .grid-line { position: absolute; top: 16px; width: 1px; background: var(--border); opacity: .5; }
  .row { display: flex; align-items: center; height: 30px; }
  .row .gutter { width: 168px; flex: none; display: flex; align-items: center; gap: 7px; padding-right: 8px; overflow: hidden; }
  .row .gutter .ico { width: 16px; text-align: center; flex: none; }
  .row .gutter .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .gutter .lab small { color: var(--muted); }
  .track { position: relative; flex: 1; height: 100%; }
  .span { position: absolute; top: 7px; height: 16px; border-radius: 5px; min-width: 3px; cursor: pointer; display: flex; align-items: center; padding: 0 6px; font-size: 10.5px; color: #fff; overflow: hidden; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .span:hover { filter: brightness(1.15); outline: 1px solid rgba(255,255,255,.6); }
  .span.point { width: 9px; height: 9px; top: 11px; border-radius: 50%; padding: 0; box-shadow: 0 0 0 3px rgba(100,116,139,.2); }

  /* flow / context graph */
  .flow { background: var(--panel); border: 1px solid var(--border); border-radius: 13px; padding: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .fnode { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--border2); position: relative; }
  .fnode .fi { width: 18px; text-align: center; }
  .fnode .ft { font-weight: 600; } .fnode .fs { color: var(--muted); font-size: 11px; }
  .fnode.llm { box-shadow: inset 0 0 0 1px rgba(59,130,246,.4); }
  .fnode.tool { box-shadow: inset 0 0 0 1px rgba(139,92,246,.4); }
  .fnode.err { box-shadow: inset 0 0 0 1px rgba(239,68,68,.5); background: rgba(239,68,68,.08); }
  .farrow { color: var(--muted2); font-size: 16px; }
  .fckpt { display: inline-flex; align-items: center; gap: 5px; color: var(--ok); font-size: 11px; padding: 4px 9px; border-radius: 999px; background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3); }
  .fend { display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 10px; background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.4); color: #bbf7d0; font-weight: 600; }

  /* history */
  .hist { border: 1px solid var(--border); border-radius: 13px; overflow: hidden; }
  .hrow { display: grid; grid-template-columns: 38px 1fr 84px 116px; gap: 8px; align-items: center; padding: 9px 15px; border-bottom: 1px solid var(--border); }
  .hrow:last-child { border-bottom: none; } .hrow:hover { background: var(--panel); }
  .hrow .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .hrow .ty { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .hrow .pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; flex: none; }
  .hrow .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hrow .dur, .hrow .tok { color: var(--muted); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; }

  .empty { color: var(--muted); text-align: center; padding: 80px 20px; }
  .empty code { background: var(--panel); padding: 2px 7px; border-radius: 6px; color: var(--accent); }

  #tip { position: fixed; pointer-events: none; background: #05070c; border: 1px solid var(--border2); border-radius: 9px; padding: 9px 11px; font-size: 11.5px; max-width: 300px; display: none; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  #tip .t { font-weight: 700; margin-bottom: 4px; } #tip .l { color: var(--muted); }

  /* metrics tab: ML anomaly ribbons, alarm pill, config card, deep-link */
  .alarmpill { background: rgba(239,68,68,.15); color: #fca5a5; border: 1px solid rgba(239,68,68,.4); padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .alarmpill:hover { background: rgba(239,68,68,.24); }

  /* governor advisory card: fixed right, severity-colored, click-to-act
     (pre-fills the Terminal — execution still goes through its confirm flow) */
  #advisory-card { position: fixed; right: 18px; top: 64px; width: 304px; z-index: 40; background: var(--panel); border: 1px solid var(--border2); border-radius: 12px; padding: 10px 12px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  .adv-h { font-weight: 700; font-size: 12.5px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .adv-n { background: rgba(245,158,11,.18); color: #fcd34d; border-radius: 999px; padding: 1px 8px; font-size: 11px; }
  .adv-row { display: flex; gap: 8px; padding: 7px 6px; border-radius: 8px; cursor: pointer; align-items: flex-start; }
  .adv-row:hover { background: var(--bg2); }
  .adv-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; margin-top: 4px; }
  .adv-t { font-size: 12px; font-weight: 600; }
  .adv-p { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .adv-f { color: var(--muted2); font-size: 10.5px; margin-top: 6px; }
  .ribbon-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .ribbon-row .rl { color: var(--muted); font-size: 11px; min-width: 78px; text-transform: uppercase; letter-spacing: .4px; }
  .ribbon-row .rv { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
  .ribbon { height: 9px; border-radius: 5px; background: var(--bg); overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
  .ribbon > span { display: block; height: 100%; border-radius: 5px; min-width: 2px; transition: width .3s; }
  .cfgcard { background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--border2); border-radius: 13px; padding: 24px 26px; max-width: 700px; margin: 14px auto; line-height: 1.7; }
  .cfgcard h3 { margin: 0 0 12px; font-size: 15px; font-weight: 700; }
  .cfgcard p { margin: 8px 0; }
  .cfgcard code { background: var(--bg); padding: 2px 7px; border-radius: 6px; color: var(--accent); }
  .cfgcard .muted { color: var(--muted); }
  .deeplink { background: var(--panel2); border: 1px solid var(--border2); color: var(--accent); font: inherit; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 14px; }
  .deeplink:hover { background: var(--panel); filter: brightness(1.1); }

  /* terminal tab: a Ghostty-styled command console (a kova REST interpreter,
     not a PTY). Mono, dark, blinking caret; scrollback + prompt input. */
  .term { display: flex; flex-direction: column; height: calc(100vh - 150px); min-height: 380px; background: #04060a; border: 1px solid var(--border2); border-radius: 13px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(91,157,255,.06), 0 10px 40px rgba(0,0,0,.4); }
  .term-bar { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--border); background: var(--bg2); color: var(--muted); font-size: 11.5px; }
  .term-bar .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .term-bar .right { margin-left: auto; color: var(--muted2); }
  .term-out { flex: 1; overflow: auto; padding: 14px 16px; font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.55; }
  .term-out > div { white-space: pre; }
  .term-out > div.wrap { white-space: pre-wrap; word-break: break-word; }
  .term-echo { color: var(--accent); }
  .term-echo::before { content: "kova❯ "; color: var(--accent2); font-weight: 700; }
  .term-output { color: var(--text); }
  .term-error { color: var(--err); }
  .term-confirm { color: var(--warn); }
  .term-muted { color: var(--muted); }
  .term-line { display: flex; align-items: center; gap: 9px; padding: 11px 16px; border-top: 1px solid var(--border); background: var(--bg2); }
  .term-line .pr { color: var(--accent2); font-weight: 700; flex: none; font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
  .term-line input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12.5px; caret-color: var(--accent); }
  .term-line input::placeholder { color: var(--muted2); }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="grad">Lumen.</span></div>
  <div class="tag">agent observability</div>
  <nav class="tabs">
    <button id="tab-overview" class="on" onclick="setView('overview')">Overview</button>
    <button id="tab-traces" onclick="setView('traces')">Traces</button>
    <button id="tab-lifecycle" onclick="setView('lifecycle')">Lifecycle</button>
    <button id="tab-flow" onclick="setView('flow')">Flow</button>
    <button id="tab-metrics" onclick="setView('metrics')">Metrics</button>
    <button id="tab-terminal" onclick="setView('terminal')">Terminal</button>
  </nav>
  <div class="hstats">
    <div class="hstat"><div class="v" id="s-runs">—</div><div class="k">runs</div></div>
    <div class="hstat"><div class="v" id="s-cost">—</div><div class="k">cost</div></div>
    <div class="hstat"><div class="v" id="s-tok">—</div><div class="k">tokens</div></div>
    <span id="alarmpill" class="alarmpill" style="display:none" title="active Netdata alarms" onclick="setView('metrics')"></span>
    <div class="live" id="live" title="auto-refresh every 4s"><span class="pulse"></span><span id="live-t">live</span></div>
  </div>
</header>

<div class="wrap" id="root"><div class="empty">Loading traces…</div></div>
<div id="tip"></div>
<div id="advisory-card" style="display:none"></div>

<script>
const C = { llm:"#3b82f6", tool:"#8b5cf6", ckpt:"#64748b", err:"#ef4444", unknown:"#888", ok:"#22c55e", warn:"#f59e0b" };
const PALETTE = ["#5b9dff","#a855f7","#22d3ee","#f59e0b","#22c55e","#ec4899","#14b8a6","#f97316"];
let TRACES = [], SELECTED = null, LIVE = true, VIEW = "overview", FILTER = "";
// Netdata-backed Metrics tab state. NETDATA: {configured, reachable}; ALARMS:
// active health alarms; METRIC_WINDOW: a per-run deep-link window (absolute
// start/end ms so the relative query is recomputed correctly on each refresh).
let NETDATA = {configured:false, reachable:false}, ALARMS = [], METRIC_WINDOW = null;
// Terminal tab state. KOVA: {configured, reachable, loaded} (probed once via
// /api/kova-status). TERM_HIST/TERM_HISTI: command history + cursor. TERM_PENDING:
// a destructive command line awaiting an explicit confirm.
let KOVA = {configured:false, reachable:false, loaded:false};
let TERM_HIST = [], TERM_HISTI = 0, TERM_PENDING = null;
// Flow tab state (Markov + Bayesian). FLOW_TYPE: the workflow type loaded;
// FLOW_RUN: an optional run id (fills the exact cancel/resume command in the
// risk affordance); FLOW_DATA: the kova FlowGraph; FLOW_ERR: an inline error.
let FLOW_TYPE = "", FLOW_RUN = "", FLOW_DATA = null, FLOW_ERR = "";
// Top-level verbs for tab-completion (mirror of kova.rs KOVA_VERBS; a Rust test
// asserts this list and KOVA_VERBS stay in sync).
const KOVA_VERBS = ["status","config","agents","agent","workflows","workflow","awaiting","approvals","advisory","schedules","schedule","tools","queues","traces","trace","llm","help","clear"];

const fmtUsd = n => { const v = n||0; return "$" + v.toFixed(v<0.01?5:4); };
const fmtTok = n => n>=1000 ? (n/1000).toFixed(1)+"k" : String(n||0);
const fmtDur = ms => ms<1000 ? Math.round(ms)+"ms" : ms<60000 ? (ms/1000).toFixed(ms<10000?2:1)+"s" : (ms/60000).toFixed(1)+"m";
function fmtBytes(n){ n=n||0; if(n<1024) return Math.round(n)+" B"; if(n<1048576) return (n/1024).toFixed(1)+" KB"; if(n<1073741824) return (n/1048576).toFixed(1)+" MB"; return (n/1073741824).toFixed(2)+" GB"; }
const shortId = s => { s=String(s); return s.length>12 ? s.slice(0,12)+"…" : s; };

// The fixed kova chart set (mirrors netdata.rs KOVA_CHARTS) with display meta.
const METRIC_CHARTS = [
  { id:"prometheus.kova_queue_depth",             title:"Agent-dispatch queue depth", fmt:n=>String(Math.round(n)) },
  { id:"prometheus.kova_wal_bytes_total",         title:"WAL bytes",                  fmt:fmtBytes },
  { id:"prometheus.kova_agent_iterations_total",  title:"Throughput (iterations)",    fmt:n=>String(Math.round(n)) },
  { id:"prometheus.kova_agent_tokens_completion", title:"Completion tokens",          fmt:fmtTok },
  { id:"prometheus.kova_agent_run_total_cost_usd",title:"Cost (USD)",                 fmt:fmtUsd },
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Safe to interpolate into a single-quoted JS string inside a double-quoted
// HTML attribute (onclick="…'${jsAttr(v)}'…"): backslash-escape \\ and ' first
// (JS-string level), then HTML-escape (attribute level). esc() alone misses ',
// which lets an agent_id like `x';alert(1)//` break out of the handler.
const jsAttr = s => esc(String(s).replace(/[\\']/g, c => "\\" + c));

function stepInfo(st) {
  const t = st.step_type || {};
  if (t.LlmCall)    return { kind:"llm",  label:t.LlmCall.model, sub:t.LlmCall.finish_reason, icon:"🧠", color:C.llm, point:false };
  if (t.ToolCall)   return { kind:"tool", label:t.ToolCall.tool_name, sub:t.ToolCall.success?"ok":"failed", icon:"🔧", color:t.ToolCall.success?C.tool:C.err, point:false };
  if (t.Checkpoint) return { kind:"ckpt", label:"checkpoint", sub:"iter "+t.Checkpoint.iteration, icon:"⚓", color:C.ckpt, point:true };
  if (t.Error)      return { kind:"err",  label:"error", sub:t.Error.message, icon:"✕", color:C.err, point:false };
  return { kind:"unknown", label:"unknown", sub:"", icon:"•", color:C.unknown, point:true };
}
const statusInfo = s => s==="Completed" ? {dot:C.ok,label:"completed"} : s==="Running" ? {dot:C.llm,label:"running"} : (s&&s.Failed!==undefined) ? {dot:C.err,label:"failed"} : {dot:C.ckpt,label:String(s)};
function traceEnd(t){ if(t.completed_at_ms) return t.completed_at_ms; let m=t.started_at_ms; for(const s of t.steps) m=Math.max(m,s.started_at_ms+s.duration_ms); return m; }
const traceDur = t => traceEnd(t) - t.started_at_ms;

/* ---------- charts (zero-dependency, hand-rolled) ---------- */
function hbars(items, fmt) {
  const max = Math.max(...items.map(i=>i.value), 1e-9);
  return `<div class="bars">` + items.map(i => `
    <div class="bar-row"><div class="bl" title="${esc(i.label)}">${esc(i.label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${i.value/max*100}%;background:${i.color||'linear-gradient(90deg,#5b9dff,#a855f7)'}"></div></div>
      <div class="bar-val">${fmt(i.value)}</div></div>`).join("") + `</div>`;
}
function stackbars(items) { // items: {label, parts:[{value,color}], total}
  const max = Math.max(...items.map(i=>i.total), 1e-9);
  return `<div class="bars">` + items.map(i => `
    <div class="bar-row"><div class="bl" title="${esc(i.label)}">${esc(i.label)}</div>
      <div class="bar-track"><div class="bar-fill stack" style="width:${i.total/max*100}%">
        ${i.parts.map(p=>`<span style="width:${i.total?p.value/i.total*100:0}%;background:${p.color}" title="${p.value}"></span>`).join("")}
      </div></div><div class="bar-val">${fmtTok(i.total)}</div></div>`).join("") + `</div>`;
}
function donut(items, label) {
  const total = items.reduce((a,i)=>a+i.value,0), size=132, sw=18, r=(size-sw)/2, circ=2*Math.PI*r;
  let off=0;
  const segs = items.filter(i=>i.value>0).map(i=>{ const len=i.value/(total||1)*circ; const s=`<circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="${i.color}" stroke-width="${sw}" stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`; off+=len; return s; }).join("");
  const center = items.reduce((a,i)=>a+i.value,0);
  return `<div class="donut-wrap"><div class="donut-c" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}"><circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="var(--bg)" stroke-width="${sw}"/>${segs}</svg>
    <div class="center"><div class="n">${center}</div><div class="l">${esc(label)}</div></div></div>
    <div class="legend">${items.map(i=>`<div class="lg"><span class="sw" style="background:${i.color}"></span>${esc(i.label)}<span class="lv">${i.value}</span></div>`).join("")}</div></div>`;
}

<!-- SHARED_RENDER_START -->
/* ---------- lifecycle render (SELF-CONTAINED — single-sourced between the
   SHARED_RENDER markers; extracted verbatim into the offline export HTML, so it
   must NOT reference anything outside this block: own helpers, own palette, own
   colors as hex. Operates purely on a Lifecycle JSON object `lc`). ---------- */
const LCP = { panel2:"#161b27", border:"#1f2533", border2:"#2a3142", fg:"#e6e9ef",
  muted:"#8b93a7", bg:"#0b0e14", ok:"#22c55e", err:"#ef4444", llm:"#3b82f6",
  recovery:"#ec4899", workflow:"#22d3ee", swarm:"#f59e0b" };
const LC_LANES = [
  {id:"Llm", label:"LLM", color:"#3b82f6"},
  {id:"Tool", label:"Tool", color:"#8b5cf6"},
  {id:"Wait", label:"Wait", color:"#64748b"},
  {id:"Workflow", label:"Workflow", color:"#22d3ee"},
  {id:"Swarm", label:"Swarm", color:"#f59e0b"},
  {id:"Recovery", label:"Recovery", color:"#ec4899"},
];
const lcEsc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lcClip = (s,n) => { s=String(s==null?"":s); return s.length>n ? s.slice(0,n-1)+"…" : s; };
const lcShort = s => lcClip(s,16);
const lcUsd = n => { const v=Number(n)||0; return "$"+v.toFixed(v<0.01?5:4); };
const lcDur = ms => { ms=Number(ms)||0; return ms<1000?Math.round(ms)+"ms":ms<60000?(ms/1000).toFixed(ms<10000?2:1)+"s":(ms/60000).toFixed(1)+"m"; };
const lcTok = n => { n=Number(n)||0; return n>=1000?(n/1000).toFixed(1)+"k":String(n); };
// Declarative-step kind → accent color (await_signal violet, await cyan, sleep
// slate, failed red, compensation amber; plain step muted).
const wfKindColor = k => ({await_signal:"#a855f7", await:"#22d3ee", sleep:"#64748b", failed:"#ef4444", compensation:"#f59e0b"}[k] || "#8b93a7");
// A step whose status means "parked, not done" (so the swimlane shows it as a
// wait, not a completed bar).
const lcWaiting = st => /await|sleep|signal/i.test(String(st||""));

// Zoom controls for an SVG graph (DAG / swarm). The SVG carries a viewBox, so
// zoom is just rescaling its width/height attributes — no transform math, and it
// works in the offline export via inline onclick (no event wiring). Scroll the
// panel to pan. Self-contained: lives inside the shared block.
function zoomControls(){
  const b = `background:${LCP.panel2};border:1px solid ${LCP.border2};color:${LCP.fg};border-radius:6px;cursor:pointer;font-size:12px;padding:2px 9px`;
  return `<div style="display:flex;gap:6px;margin-bottom:8px;align-items:center">`+
    `<button type="button" style="${b}" onclick="lcZoom(this,1.25)">+</button>`+
    `<button type="button" style="${b}" onclick="lcZoom(this,0.8)">&minus;</button>`+
    `<button type="button" style="${b}" onclick="lcZoom(this,0)">reset</button>`+
    `<span style="color:${LCP.muted};font-size:10px">zoom · scroll to pan</span></div>`;
}
function lcZoom(btn,f){
  const p=btn.closest(".panel"); if(!p) return;
  const svg=p.querySelector("svg"); if(!svg) return;
  const vb=(svg.getAttribute("viewBox")||"0 0 100 100").split(/\s+/).map(Number);
  let s=parseFloat(svg.getAttribute("data-s")||"1");
  s = f===0 ? 1 : Math.min(4, Math.max(0.3, s*f));
  svg.setAttribute("data-s", String(s));
  svg.setAttribute("width", (vb[2]*s).toFixed(0));
  svg.setAttribute("height", (vb[3]*s).toFixed(0));
}

// Time-accurate swimlane (Gantt) over the whole recovery chain, lane-grouped.
function swimlane(lc){
  const nodes = (lc&&lc.timeline)||[];
  if(!nodes.length) return '<div class="empty">No timeline steps recorded.</div>';
  let t0=Infinity,t1=-Infinity;
  for(const n of nodes){ t0=Math.min(t0,n.t_start); t1=Math.max(t1,n.t_start+(n.dur_ms||0)); }
  const span=Math.max(t1-t0,1), LBL=120, H=34;
  const present = LC_LANES.filter(l=> nodes.some(n=>n.lane===l.id));
  const rows = present.map(l=>{
    const bars = nodes.filter(n=>n.lane===l.id).map(n=>{
      const left=(n.t_start-t0)/span, width=Math.max((n.dur_ms||0)/span,0.006);
      const isPoint=(n.dur_ms||0)===0, st=n.status||"ok";
      // "denied" = a tool-policy rejection (orange), distinct from a real tool
      // error (red) and from swarm-amber; the ⊘ prefix already rides in n.phase.
      const bg = st==="error" ? LCP.err : st==="denied" ? "#f97316" : lcWaiting(st) ? "#64748b" : l.color;
      const tip = `${lcEsc(n.phase)} · +${lcDur(n.t_start-t0)} · ${lcDur(n.dur_ms)}`+
        `${n.tokens?` · ${lcTok(n.tokens)} tok`:""}${n.cost_usd!=null?` · ${lcUsd(n.cost_usd)}`:""} · ${lcEsc(st)}`;
      const posLeft = `calc(${LBL}px + (100% - ${LBL}px) * ${left})`;
      const common = `position:absolute;left:${posLeft};overflow:hidden;white-space:nowrap;color:#fff;`+
        `box-shadow:0 1px 3px rgba(0,0,0,.3);`;
      if(isPoint) return `<div title="${tip}" style="${common}top:9px;width:11px;height:11px;border-radius:50%;background:${bg};border:2px solid ${LCP.bg}"></div>`;
      return `<div title="${tip}" style="${common}top:8px;height:18px;width:calc((100% - ${LBL}px) * ${width});min-width:3px;`+
        `border-radius:5px;background:${bg};font-size:10px;padding:0 6px;display:flex;align-items:center">${lcEsc(lcShort(n.phase))}</div>`;
    }).join("");
    return `<div style="position:relative;height:${H}px;border-bottom:1px solid ${LCP.border}">`+
      `<div style="position:absolute;left:0;top:9px;width:${LBL-8}px;color:${l.color};font-weight:700;font-size:11px">${lcEsc(l.label)}</div>${bars}</div>`;
  }).join("");
  const dividers = nodes.filter(n=>n.lane==="Recovery").map(n=>{
    const left=(n.t_start-t0)/span;
    return `<div title="crash → resume" style="position:absolute;left:calc(${LBL}px + (100% - ${LBL}px) * ${left});top:0;bottom:0;border-left:2px dashed ${LCP.recovery}"></div>`;
  }).join("");
  const TICKS=6; let ruler="";
  for(let i=0;i<=TICKS;i++){const p=i/TICKS; ruler+=`<div style="position:absolute;left:calc(${LBL}px + (100% - ${LBL}px) * ${p});top:0;transform:translateX(-50%);color:${LCP.muted};font-size:10px">${lcDur(span*p)}</div>`;}
  return `<div class="panel" style="position:relative">`+
    `<div style="position:relative;height:16px;margin-bottom:6px;border-bottom:1px dashed ${LCP.border2}">${ruler}</div>`+
    `<div style="position:relative">${rows}${dividers}</div></div>`;
}

// Hand-rolled causal DAG: 2-pass layered layout (BFS rank from caused_by roots,
// sorted by id within rank), cubic-bezier edges + one arrowhead marker.
function causalDag(lc){
  const g=(lc&&lc.causal)||{nodes:[],edges:[]}, nodes=g.nodes||[], edges=g.edges||[];
  if(!nodes.length) return '<div class="empty">No causal events recorded for this run.</div>';
  const parent=new Map(); for(const e of edges) parent.set(e.to, e.from);
  const sorted=[...nodes].sort((a,b)=>a.id-b.id);
  const rank=new Map();
  for(const n of sorted){ const p=parent.get(n.id); rank.set(n.id, (p!=null&&rank.has(p))?rank.get(p)+1:0); }
  const ranks=new Map();
  for(const n of sorted){ const r=rank.get(n.id); if(!ranks.has(r)) ranks.set(r,[]); ranks.get(r).push(n); }
  const maxRank=Math.max(0,...ranks.keys()); let maxCol=1; for(const a of ranks.values()) maxCol=Math.max(maxCol,a.length);
  const COLW=210, ROWH=64, NW=180, NH=42, PADX=16, PADY=16;
  const pos=new Map();
  for(const [r,arr] of ranks) arr.forEach((n,i)=> pos.set(n.id,{x:PADX+r*COLW, y:PADY+i*ROWH}));
  const W=PADX*2+(maxRank+1)*COLW, Hh=PADY*2+maxCol*ROWH;
  const catColor = rt => { rt=String(rt||"");
    if(/Result/.test(rt)) return LCP.ok;
    if(/Directive|Tool/.test(rt)) return "#8b5cf6";
    if(/Workflow|Step|Branch|Await/.test(rt)) return LCP.workflow;
    if(/Swarm|Delegation|Handoff/.test(rt)) return LCP.swarm;
    return LCP.llm; };
  const epaths = edges.map(e=>{ const a=pos.get(e.from), b=pos.get(e.to); if(!a||!b) return "";
    const x1=a.x+NW, y1=a.y+NH/2, x2=b.x, y2=b.y+NH/2, mx=(x1+x2)/2;
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${LCP.llm}" stroke-width="1.5" marker-end="url(#lcArrow)" opacity="0.8"/>`;
  }).join("");
  const rects = sorted.map(n=>{ const p=pos.get(n.id), col=catColor(n.record_type);
    return `<g><rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="8" fill="${LCP.panel2}" stroke="${col}" stroke-width="1.5"/>`+
      `<text x="${p.x+10}" y="${p.y+17}" fill="${col}" font-size="11" font-weight="700">${lcEsc(lcClip(n.record_type,20))}</text>`+
      `<text x="${p.x+10}" y="${p.y+33}" fill="${LCP.muted}" font-size="10">${lcEsc(lcClip(n.summary,24))}</text>`+
      `<title>#${n.id} ${lcEsc(n.record_type)} · ${lcEsc(n.summary)}</title></g>`;
  }).join("");
  const note = edges.length ? "" : `<div class="empty" style="margin-top:8px">Events present, but no causal edges — a pure-text / single-step run.</div>`;
  return `<div class="panel" style="overflow:auto;max-height:78vh">${zoomControls()}<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" data-s="1">`+
    `<defs><marker id="lcArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="${LCP.llm}"/></marker></defs>`+
    `${epaths}${rects}</svg>${note}</div>`;
}

// Crash→resume run pills (only when the chain has more than one run).
function recoveryChain(lc){
  const chain=(lc&&lc.recovery_chain)||[];
  if(chain.length<=1) return "";
  const pills = chain.map((id,i)=>{
    const arrow = i>0 ? `<span title="crash → WAL replay → resume" style="color:${LCP.recovery};margin:0 8px;font-weight:700">⚡⟳</span>` : "";
    return `${arrow}<span style="background:${LCP.panel2};border:1px solid ${LCP.border2};border-radius:20px;padding:5px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px">${lcEsc(lcShort(id))}</span>`;
  }).join("");
  return `<div class="panel" style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">`+
    `<span style="color:${LCP.muted};margin-right:8px">crash-recovery chain:</span>${pills}</div>`;
}

// Continue-As-New run pills (only when the chain has more than one run). Cyan
// ↻ — a workflow continuation hand-off, distinct from the magenta crash-recovery
// chain above. Mirrors recoveryChain(); fed by lc.continuation_chain.
function continuationChain(lc){
  const chain=(lc&&lc.continuation_chain)||[];
  if(chain.length<=1) return "";
  const pills = chain.map((id,i)=>{
    const arrow = i>0 ? `<span title="continue-as-new → fresh successor run" style="color:${LCP.workflow};margin:0 8px;font-weight:700">↻</span>` : "";
    return `${arrow}<span style="background:rgba(34,211,238,.14);border:1px solid ${LCP.workflow};border-radius:20px;padding:5px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px">${lcEsc(lcShort(id))}</span>`;
  }).join("");
  return `<div class="panel" style="display:flex;align-items:center;flex-wrap:wrap;gap:4px">`+
    `<span style="color:${LCP.muted};margin-right:8px">continuation chain:</span>${pills}</div>`;
}

// Provenance + tamper-evidence badge.
function lcProvenance(lc){
  const p=(lc&&lc.provenance)||{sources:[],wal_hmac_note:""};
  const chips=(p.sources||[]).map(s=>`<span style="background:rgba(91,157,255,.14);color:#9cc4ff;border-radius:6px;padding:2px 8px;font-size:11px;margin-right:6px">${lcEsc(s)}</span>`).join("");
  const tamper=/HMAC|tamper/i.test(p.wal_hmac_note||"");
  return `<div class="panel" style="display:flex;gap:12px;align-items:flex-start"><div style="font-size:22px">${tamper?"🛡️":"📄"}</div>`+
    `<div><div style="font-weight:700;margin-bottom:3px">Provenance${tamper?` <span style="color:${LCP.ok};font-size:11px">· tamper-evident (SM3-HMAC)</span>`:""}</div>`+
    `<div style="margin-bottom:6px">sources: ${chips||`<span style="color:${LCP.muted}">none</span>`}</div>`+
    `<div style="color:${LCP.muted};font-size:11.5px;max-width:760px">${lcEsc(p.wal_hmac_note)}</div></div></div>`;
}

// Swarm delegation graph: layered SVG (supervisors→workers), modeled on
// causalDag. Rank = delegation depth (BFS fixpoint, capped at node count so a
// stray cycle never spins); supervisors render violet, workers amber, errored
// agents red; delegation edges amber, handoff edges cyan.
function swarmGraph(lc){
  const g=(lc&&lc.swarm)||{nodes:[],edges:[]}, nodes=g.nodes||[], edges=g.edges||[];
  if(!nodes.length) return '<div class="empty">No swarm delegations recorded for this run.</div>';
  const idx=new Map(nodes.map(n=>[n.id,n]));
  const rank=new Map(nodes.map(n=>[n.id,0]));
  for(let pass=0; pass<nodes.length; pass++){ let changed=false;
    for(const e of edges){ if(!idx.has(e.from)||!idx.has(e.to)) continue;
      const nr=rank.get(e.from)+1; if(nr>rank.get(e.to)){ rank.set(e.to,nr); changed=true; } }
    if(!changed) break; }
  const ranks=new Map();
  for(const n of [...nodes].sort((a,b)=>String(a.id).localeCompare(String(b.id)))){
    const r=rank.get(n.id)||0; if(!ranks.has(r)) ranks.set(r,[]); ranks.get(r).push(n); }
  const maxRank=Math.max(0,...ranks.keys()); let maxCol=1; for(const a of ranks.values()) maxCol=Math.max(maxCol,a.length);
  const COLW=210, ROWH=72, NW=182, NH=50, PADX=16, PADY=16;
  const pos=new Map();
  for(const [r,arr] of ranks) arr.forEach((n,i)=> pos.set(n.id,{x:PADX+r*COLW, y:PADY+i*ROWH}));
  const W=PADX*2+(maxRank+1)*COLW, Hh=PADY*2+maxCol*ROWH;
  const isSup = n => /supervis|lead|coordinat/i.test(n.agent_type||"");
  const nodeColor = n => /fail|error/i.test(n.status||"") ? LCP.err : (isSup(n)?"#a855f7":LCP.swarm);
  const isHandoff = t => /handoff/i.test(t||"");
  const epaths = edges.map(e=>{ const a=pos.get(e.from), b=pos.get(e.to); if(!a||!b) return "";
    const x1=a.x+NW, y1=a.y+NH/2, x2=b.x, y2=b.y+NH/2, mx=(x1+x2)/2;
    const col=isHandoff(e.edge_type)?LCP.workflow:LCP.swarm, mk=isHandoff(e.edge_type)?"swArrowH":"swArrow";
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="1.5" marker-end="url(#${mk})" opacity="0.85"><title>${lcEsc(e.from)} ${lcEsc(e.edge_type)}→ ${lcEsc(e.to)}</title></path>`;
  }).join("");
  const rects = nodes.map(n=>{ const p=pos.get(n.id); if(!p) return "";
    const col=nodeColor(n), tok=(n.prompt_tokens||0)+(n.completion_tokens||0);
    return `<g><rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="8" fill="${LCP.panel2}" stroke="${col}" stroke-width="1.5"/>`+
      `<text x="${p.x+10}" y="${p.y+18}" fill="${col}" font-size="11" font-weight="700">${lcEsc(lcClip(n.id,22))}</text>`+
      `<text x="${p.x+10}" y="${p.y+33}" fill="${LCP.muted}" font-size="10">${lcEsc(n.agent_type)}${tok?` · ${lcTok(tok)} tok`:""}</text>`+
      `<text x="${p.x+10}" y="${p.y+45}" fill="${/fail|error/i.test(n.status||"")?LCP.err:LCP.muted}" font-size="9">${lcEsc(lcClip(n.status,26))}</text>`+
      `<title>${lcEsc(n.id)} · ${lcEsc(n.agent_type)} · ${lcEsc(n.status)} · ${tok} tok</title></g>`;
  }).join("");
  const legend = `<div style="display:flex;gap:16px;margin-top:8px;font-size:11px;color:${LCP.muted};flex-wrap:wrap">`+
    `<span><b style="color:#a855f7">■</b> supervisor</span><span><b style="color:${LCP.swarm}">■</b> worker</span>`+
    `<span><b style="color:${LCP.swarm}">→</b> delegation</span><span><b style="color:${LCP.workflow}">→</b> handoff</span></div>`;
  return `<div class="panel" style="overflow:auto;max-height:78vh">${zoomControls()}<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" data-s="1">`+
    `<defs><marker id="swArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="${LCP.swarm}"/></marker>`+
    `<marker id="swArrowH" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="${LCP.workflow}"/></marker></defs>`+
    `${epaths}${rects}</svg>${legend}</div>`;
}

// Compose the full lifecycle view into `el` from a Lifecycle JSON object.
function renderLifecycleInto(el, lc){
  if(!lc){ el.innerHTML='<div class="empty">No lifecycle data.</div>'; return; }
  const dur = (lc.completed_ms!=null) ? (lc.completed_ms-lc.started_ms) : null;
  const sc = /complete/i.test(lc.status)?LCP.ok:/fail|error/i.test(lc.status)?LCP.err:LCP.llm;
  const cards = `<div class="cards">`+
    `<div class="card"><div class="k">status</div><div class="v" style="color:${sc}">${lcEsc(lc.status)}</div></div>`+
    `<div class="card"><div class="k">duration</div><div class="v">${dur!=null?lcDur(dur):"—"}</div></div>`+
    `<div class="card"><div class="k">tokens</div><div class="v">${lcTok(lc.total_tokens)}</div></div>`+
    `<div class="card"><div class="k">cost</div><div class="v">${lcUsd(lc.total_cost_usd)}</div></div>`+
    `<div class="card"><div class="k">steps</div><div class="v">${(lc.timeline||[]).length}</div></div></div>`;
  let wf="";
  if((lc.workflow_steps||[]).length){
    const rows=lc.workflow_steps.map(s=>`<div style="display:flex;gap:10px;padding:6px 0;border-bottom:1px solid ${LCP.border}">`+
      `<span style="color:${LCP.workflow};font-family:monospace;width:42px">#${s.index}</span>`+
      `<span style="width:120px;color:${wfKindColor(s.kind)};font-weight:${s.kind==="step"?400:700}">${lcEsc(s.kind)}</span>`+
      `<span style="flex:1">${lcEsc(lcClip(s.label,80))}</span>`+
      `<span style="color:${LCP.muted}">${lcDur(s.dur_ms)}</span></div>`).join("");
    wf=`<div class="section-title">Workflow steps</div><div class="panel">${rows}</div>`;
  }
  let sw="";
  if(lc.swarm && (lc.swarm.nodes||[]).length){
    sw=`<div class="section-title">Swarm delegations</div>`+swarmGraph(lc);
  }
  // Continue-As-New is a workflow handoff, NOT a crash recovery — render it as a
  // distinct cyan pill so it never reads as a plain completion (both are
  // status="completed") nor as a magenta recovery-chain hop.
  const canPill = lc.continued_as_new
    ? `<span title="this run handed off to a successor via Continue-As-New — not a crash recovery" style="background:rgba(34,211,238,.14);color:${LCP.workflow};border:1px solid ${LCP.workflow};border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;margin-left:8px">↻ Continue-As-New</span>`
    : "";
  el.innerHTML = `<h2 style="margin:4px 0 2px">${lcEsc(lc.run_id)}</h2>`+
    `<div style="color:${LCP.muted};margin-bottom:8px">${lc.agent_id?`agent <b style="color:${LCP.fg}">${lcEsc(lc.agent_id)}</b> · `:""}lifecycle${canPill}</div>`+
    cards + recoveryChain(lc)+ continuationChain(lc)+
    `<div class="section-title">Timeline (swimlane)</div>`+swimlane(lc)+
    `<div class="section-title">Causal graph</div>`+causalDag(lc)+
    wf + sw +
    `<div class="section-title">Provenance</div>`+lcProvenance(lc);
}

// ── Markov / Bayesian (workflow-type flow) ─────────────────────────────────
// Self-contained (same rule as the rest of this block): renders a kova
// `FlowGraph` object `fg` (GET /api/v1/workflows/types/{type}/flow). Lumen NEVER
// re-aggregates — `fg` is the server's numbers; these functions only draw them.

// Node accent: step=blue, completed=green, failed=red, cancelled=orange,
// holding (await_*/paused)=cyan. Mirrors the swimlane/causal palette.
function flowNodeColor(n){
  if(n.kind==="terminal") return n.state==="completed"?LCP.ok : n.state==="failed"?LCP.err : "#f97316";
  if(n.kind==="holding") return LCP.workflow;
  return LCP.llm;
}

// Markov state-transition graph: left→right ranks (step:i at rank i; terminal +
// holding sinks forced to the rightmost rank), edge width ∝ p, label `p% · n`.
// Modeled on causalDag's layered SVG. `currentState` (optional) glows the node a
// live run is currently sitting on (cyan ring).
function markovFlow(fg, currentState){
  const nodes=(fg&&fg.nodes)||[], edges=(fg&&fg.edges)||[];
  if(!nodes.length) return '<div class="empty">No runs of this workflow type recorded yet.</div>';
  const stepIdx = s => { const m=/^step:(\d+)$/.exec(String(s)); return m?parseInt(m[1],10):null; };
  let maxStep=0; for(const n of nodes){ const i=stepIdx(n.state); if(i!=null) maxStep=Math.max(maxStep,i); }
  const sinkRank = maxStep+1;                      // terminals/holdings rightmost
  const rankOf = n => { const i=stepIdx(n.state); return i!=null?i:sinkRank; };
  const sinkOrder = {completed:0, failed:1, cancelled:2};
  const ordered=[...nodes].sort((a,b)=>{ const ra=rankOf(a),rb=rankOf(b); if(ra!==rb) return ra-rb;
    const sa=sinkOrder[a.state]!=null?sinkOrder[a.state]:9, sb=sinkOrder[b.state]!=null?sinkOrder[b.state]:9;
    return sa!==sb ? sa-sb : String(a.state).localeCompare(String(b.state)); });
  const ranks=new Map();
  for(const n of ordered){ const r=rankOf(n); if(!ranks.has(r)) ranks.set(r,[]); ranks.get(r).push(n); }
  const maxRank=Math.max(0,...ranks.keys()); let maxCol=1; for(const a of ranks.values()) maxCol=Math.max(maxCol,a.length);
  const COLW=158, ROWH=62, NW=120, NH=40, PADX=16, PADY=16;
  const pos=new Map();
  for(const [r,arr] of ranks) arr.forEach((n,i)=> pos.set(n.state,{x:PADX+r*COLW, y:PADY+i*ROWH}));
  const W=PADX*2+(maxRank+1)*COLW, Hh=PADY*2+maxCol*ROWH;
  const epaths = edges.map(e=>{ const a=pos.get(e.from), b=pos.get(e.to); if(!a||!b) return "";
    const x1=a.x+NW, y1=a.y+NH/2, x2=b.x, y2=b.y+NH/2, mx=(x1+x2)/2;
    const p=Number(e.p)||0, w=(1+p*5).toFixed(2), lx=(x1+x2)/2, ly=(y1+y2)/2-4;
    const lbl=`${Math.round(p*100)}% · ${e.count}`;
    return `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${LCP.muted}" stroke-width="${w}" marker-end="url(#mkArrow)" opacity="0.7"><title>${lcEsc(e.from)} → ${lcEsc(e.to)} · p=${p.toFixed(4)} · n=${e.count}</title></path>`+
      `<text x="${lx}" y="${ly}" fill="${LCP.muted}" font-size="9" text-anchor="middle">${lcEsc(lbl)}</text>`;
  }).join("");
  const rects = ordered.map(n=>{ const p=pos.get(n.state); if(!p) return ""; const col=flowNodeColor(n);
    const cur = currentState && n.state===currentState;
    const ring = cur ? `<rect x="${p.x-3}" y="${p.y-3}" width="${NW+6}" height="${NH+6}" rx="10" fill="none" stroke="${LCP.workflow}" stroke-width="2.5" opacity="0.95"/>` : "";
    return `<g>${ring}<rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="8" fill="${LCP.panel2}" stroke="${col}" stroke-width="${cur?2.5:1.5}"/>`+
      `<text x="${p.x+10}" y="${p.y+17}" fill="${col}" font-size="11" font-weight="700">${lcEsc(lcClip(n.state,16))}</text>`+
      `<text x="${p.x+10}" y="${p.y+32}" fill="${LCP.muted}" font-size="10">n=${n.n}${cur?" · current":""}</text>`+
      `<title>${lcEsc(n.state)} · ${lcEsc(n.kind)} · visited ${n.n}×</title></g>`;
  }).join("");
  const legend = `<div style="display:flex;gap:14px;margin-top:8px;font-size:11px;color:${LCP.muted};flex-wrap:wrap">`+
    `<span><b style="color:${LCP.llm}">■</b> step</span><span><b style="color:${LCP.ok}">■</b> completed</span>`+
    `<span><b style="color:${LCP.err}">■</b> failed</span><span><b style="color:#f97316">■</b> cancelled</span>`+
    `<span><b style="color:${LCP.workflow}">■</b> holding</span><span>edge width ∝ probability</span></div>`;
  return `<div class="panel" style="overflow:auto;max-height:70vh">${zoomControls()}<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" data-s="1">`+
    `<defs><marker id="mkArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="${LCP.muted}"/></marker></defs>`+
    `${epaths}${rects}</svg>${legend}</div>`;
}

// Bayesian outcome panel: P(completed/failed/cancelled) with Wilson CIs + a
// HIGH/MED/LOW risk badge from P(fail). HONORS the server `insufficient` flag —
// when set it shows "Insufficient data (N=k)" + observed tallies, NEVER a fake
// point estimate. `currentState` (step:k) conditions the priors on that step;
// `runId` fills the exact whitelisted cancel/resume command for a high-risk run.
function bayesianPanel(fg, runId, currentState){
  const priors=(fg&&fg.outcome_priors)||[];
  if(!priors.length) return '<div class="empty">No terminal runs yet — no outcome priors for this type.</div>';
  const m = currentState ? /^step:(\d+)$/.exec(String(currentState)) : null;
  const condStep = m ? parseInt(m[1],10) : null;
  const pick = o => (condStep!=null && priors.find(x=>x.outcome===o&&x.conditioned_on_step===condStep))
                 || priors.find(x=>x.outcome===o&&x.conditioned_on_step==null);
  const pc=pick("completed"), pf=pick("failed"), px=pick("cancelled"), ref=pf||pc||px;
  const N = ref?ref.sample_size:(fg.sample_size||0);
  const insuff = ref ? ref.insufficient : (fg.insufficient!==false);
  const cond = condStep!=null ? ` · conditioned on <b style="color:${LCP.workflow}">step ${condStep}</b>` : " · unconditional (whole type)";
  const head = `<div style="color:${LCP.muted};font-size:11px;margin-bottom:8px">Outcome probability${cond} · N=${N}</div>`;
  if(insuff){
    const oc=(fg&&fg.outcomes)||{};
    return `<div class="panel">${head}`+
      `<div style="color:#f59e0b;font-weight:700;margin-bottom:6px">⚠ Insufficient data (N=${N})</div>`+
      `<div style="color:${LCP.muted};font-size:12px">Need ≥10 terminal runs for a reliable estimate. Observed so far: `+
      `<b style="color:${LCP.ok}">${oc.completed||0} completed</b>, <b style="color:${LCP.err}">${oc.failed||0} failed</b>, `+
      `<b style="color:#f97316">${oc.cancelled||0} cancelled</b>. <span style="color:${LCP.muted}">(no point estimate shown — small samples mislead).</span></div></div>`;
  }
  const bar = (label,p,col) => { if(!p) return "";
    const v=(p.probability*100), lo=(p.ci_lo*100), hi=(p.ci_hi*100);
    return `<div style="display:flex;align-items:center;gap:8px;margin:5px 0">`+
      `<span style="width:84px;color:${col};font-weight:700">${label}</span>`+
      `<div style="flex:1;background:${LCP.panel2};border-radius:5px;height:14px;overflow:hidden"><div style="width:${v.toFixed(1)}%;height:100%;background:${col}"></div></div>`+
      `<span style="width:150px;text-align:right;color:${LCP.fg};font-size:12px">${v.toFixed(1)}% <span style="color:${LCP.muted}">(95% CI ${lo.toFixed(0)}–${hi.toFixed(0)}%)</span></span></div>`;
  };
  const bars = bar("completed",pc,LCP.ok)+bar("failed",pf,LCP.err)+bar("cancelled",px,"#f97316");
  const pfail = pf?pf.probability:0;
  const rk = pfail>0.3 ? {c:LCP.err,l:"HIGH"} : pfail>0.1 ? {c:"#f59e0b",l:"MED"} : {c:LCP.ok,l:"LOW"};
  const idTok = runId ? String(runId) : "<id>";
  const action = pfail>0.3
    ? `<div style="margin-top:10px;padding:8px 10px;border:1px solid ${LCP.err};border-radius:6px;background:rgba(239,68,68,.08)">`+
      `<div style="color:${LCP.err};font-weight:700;margin-bottom:4px">⚠ Elevated failure risk${condStep!=null?` at step ${condStep}`:""} — operability</div>`+
      `<div style="color:${LCP.muted};font-size:12px;margin-bottom:4px">A run stuck here can be cancelled or resumed from the <b>Terminal</b> tab:</div>`+
      `<div style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:${LCP.fg}">lumen kova "workflow ${lcEsc(idTok)} cancel"</div>`+
      `<div style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:${LCP.fg}">lumen kova "workflow ${lcEsc(idTok)} resume &lt;input…&gt;"</div></div>`
    : "";
  return `<div class="panel">${head}`+
    `<div style="margin-bottom:8px"><span style="background:${rk.c};color:#fff;border-radius:5px;padding:2px 8px;font-size:11px;font-weight:700">RISK ${rk.l}</span> `+
    `<span style="color:${LCP.muted};font-size:12px">P(fail) = ${(pfail*100).toFixed(1)}%</span></div>`+
    bars + action + `</div>`;
}
<!-- SHARED_RENDER_END -->

/* ---------- data ---------- */
async function load() {
  try { TRACES = await (await fetch("/api/traces")).json(); } catch(e) { TRACES = []; }
  await loadNetdataMeta();               // status + alarms (best-effort, never blocks traces)
  const cost = TRACES.reduce((a,t)=>a+(t.total_cost_usd||0),0);
  const tok = TRACES.reduce((a,t)=>a+(t.total_tokens?.prompt_tokens||0)+(t.total_tokens?.completion_tokens||0),0);
  s_runs.textContent = TRACES.length; s_cost.textContent = fmtUsd(cost); s_tok.textContent = fmtTok(tok);
  if (!SELECTED && TRACES.length) SELECTED = TRACES[0].trace_id;
  render();
}
// Refresh Netdata reachability + active alarms. Drives the header alarm pill on
// every tab; the Metrics tab reads NETDATA to choose config-card vs live panels.
async function loadNetdataMeta() {
  try { NETDATA = await (await fetch("/api/netdata-status")).json(); }
  catch(e) { NETDATA = {configured:false, reachable:false}; }
  if (NETDATA.configured && NETDATA.reachable) {
    try { ALARMS = activeAlarms(await (await fetch("/api/alarms")).json()); }
    catch(e) { ALARMS = []; }
  } else { ALARMS = []; }
  renderAlarmPill();
}
// Netdata /api/v1/alarms → the WARNING/CRITICAL entries only.
function activeAlarms(j) {
  const alarms = (j && j.alarms) || {};
  const out = [];
  for (const name of Object.keys(alarms)) {
    const a = alarms[name] || {};
    if (a.status === "WARNING" || a.status === "CRITICAL")
      out.push({ name, status:a.status, value:a.value, info:a.info || "" });
  }
  return out;
}
function renderAlarmPill() {
  const el = document.getElementById("alarmpill"); if (!el) return;
  if (!ALARMS.length) { el.style.display = "none"; return; }
  const crit = ALARMS.filter(a=>a.status==="CRITICAL").length;
  el.style.display = "";
  el.textContent = `⚠ ${ALARMS.length} alarm${ALARMS.length>1?"s":""}${crit?` · ${crit} crit`:""}`;
  el.title = ALARMS.map(a=>`${a.status}: ${a.name}`).join("\n");
}
/* ---------- governor advisory card (闭环: kova advises, the human acts) ----
   Polls /api/advisory (a server-side proxy of kova's governor snapshot) every
   30s. Click-through pre-fills the Terminal with the matching whitelisted verb
   (the SAME mapping as kova.rs console_suggestion — a Rust test pins both) or
   jumps to the Flow tab for type-level risk; execution always goes through the
   Terminal's existing confirm flow — the card never calls kova itself. */
let ADVISORIES = [];
async function loadAdvisories(){
  try{
    const r = await fetch("/api/advisory");
    const j = r.ok ? await r.json() : null;
    ADVISORIES = (j && j.advisories) || [];
  }catch(e){ ADVISORIES = []; }
  renderAdvisoryCard();
}
function renderAdvisoryCard(){
  const el = document.getElementById("advisory-card"); if(!el) return;
  if(!ADVISORIES.length){ el.style.display = "none"; el.innerHTML = ""; return; }
  const SEV = {critical:"#ef4444", warn:"#f59e0b", info:"#22c55e"};
  const rows = ADVISORIES.map(a=>{
    const c = SEV[a.severity] || "#8b93a7";
    const pred = String(a.prediction||"");
    return `<div class="adv-row" onclick="advisoryAction('${jsAttr(a.scenario)}','${jsAttr(a.subject)}')" title="${esc(a.recommended_action||"")}">`+
      `<span class="adv-dot" style="background:${c}"></span>`+
      `<div><div class="adv-t">${esc(a.scenario)} · ${esc(a.subject)}</div>`+
      `<div class="adv-p">${esc(pred.length>140 ? pred.slice(0,139)+"…" : pred)}</div></div></div>`;
  }).join("");
  el.innerHTML = `<div class="adv-h">🛡 governor <span class="adv-n">${ADVISORIES.length}</span></div>`+rows+
    `<div class="adv-f">click to act — runs through the Terminal confirm flow</div>`;
  el.style.display = "";
}
function advisoryAction(scenario, subject){
  if(scenario === "risk_start"){           // type-level risk → Flow tab
    FLOW_TYPE = subject; FLOW_DATA = null; FLOW_ERR = "";
    setView('flow');
    const el = document.getElementById("flow-type"); if(el) el.value = subject;
    loadFlow();
    return;
  }
  // Mirror of kova.rs console_suggestion — keep in lockstep (Rust drift test).
  const line = scenario === "agent_stall" ? "agent "+subject+" history"
    : scenario === "risk_run" ? "workflow "+subject
    : "status";
  setView('terminal');
  termPrefill(line, 0);
}
// The Terminal mounts lazily (reachability probe → render), so retry briefly
// until its input exists, then pre-fill WITHOUT submitting (human presses ⏎).
function termPrefill(line, tries){
  const inp = document.getElementById("terminput");
  if(inp){ inp.value = line; inp.focus(); return; }
  if(tries < 20) setTimeout(()=>termPrefill(line, tries+1), 100);
}
function setView(v){ VIEW=v; for (const t of ["overview","traces","lifecycle","flow","metrics","terminal"]) document.getElementById("tab-"+t).classList.toggle("on", v===t); render(); }
function render(){ if (VIEW==="overview") renderOverview(); else if (VIEW==="traces") renderTraces(); else if (VIEW==="lifecycle") renderLifecycle(); else if (VIEW==="flow") renderFlow(); else if (VIEW==="metrics") renderMetrics(); else if (VIEW==="terminal") renderTerminal(); }

// Lifecycle tab: the whole-run story for the SELECTED trace, drawn by the shared
// render block (the same code the offline `lumen export` HTML uses).
async function renderLifecycle(){
  const root=document.getElementById("root");
  if(!SELECTED){ root.innerHTML='<div class="empty" style="padding:48px">Select a trace in the <b>Traces</b> tab first, then open Lifecycle.</div>'; return; }
  root.innerHTML='<div class="empty" style="padding:40px">Building lifecycle…</div>';
  try{
    const lc = await (await fetch("/api/traces/"+encodeURIComponent(SELECTED)+"/lifecycle")).json();
    if(lc && lc.error){ root.innerHTML='<div class="empty" style="padding:48px">'+esc(lc.error)+'</div>'; return; }
    const bar = `<div style="margin-bottom:14px"><a href="/export?id=${encodeURIComponent(SELECTED)}" target="_blank" style="color:var(--grad1);text-decoration:none">💾 Save this lifecycle as a self-contained HTML</a></div>`;
    root.innerHTML='<div style="max-width:1180px;margin:0 auto">'+bar+'<div id="lc-body"></div></div>';
    renderLifecycleInto(document.getElementById("lc-body"), lc);
  }catch(e){ root.innerHTML='<div class="empty" style="padding:48px">Failed to load lifecycle: '+esc(String(e))+'</div>'; }
}

/* ---------- flow tab (Markov transitions + Bayesian outcome risk) ----------
   Type-level view: pick a workflow type → kova's server-computed FlowGraph
   (single source, identical to Forge). markovFlow + bayesianPanel live in the
   shared render block (so `lumen export` gets them free). Mount-once so the 4s
   poll's re-render never wipes what the operator is typing. */
function flowInputStyle(){ return `background:#0b0e14;border:1px solid var(--border,#2a3142);color:#e6e9ef;border-radius:6px;padding:7px 10px;font-size:13px`; }
function flowControlsHtml(){
  const b = `background:#161b27;border:1px solid #2a3142;color:#e6e9ef;border-radius:6px;cursor:pointer;font-size:13px;padding:7px 14px`;
  return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">`+
    `<input id="flow-type" placeholder="workflow type (e.g. expense_report)" value="${esc(FLOW_TYPE)}" style="${flowInputStyle()};min-width:240px" />`+
    `<input id="flow-run" placeholder="run id (optional)" value="${esc(FLOW_RUN)}" style="${flowInputStyle()};width:150px" />`+
    `<button id="flow-load" style="${b}">Load flow</button>`+
    `<span style="color:var(--muted,#8b93a7);font-size:12px">state-transition graph + outcome probability for one workflow type</span></div>`;
}
function wireFlow(){
  const btn=document.getElementById("flow-load"); if(btn) btn.addEventListener("click", loadFlow);
  for(const id of ["flow-type","flow-run"]){ const el=document.getElementById(id);
    if(el) el.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); loadFlow(); } }); }
}
function flowBanners(fg){
  let b="";
  if(fg.mixed_spec_versions) b+=`<div class="recover-banner">⚠ <div><b>Multiple spec versions</b> in this population — transitions across versions aren't strictly comparable. Pass a specific <code>spec_hash</code> to narrow.</div></div>`;
  if(fg.insufficient) b+=`<div class="recover-banner">📉 <div><b>Small sample (N=${fg.sample_size||0})</b> — outcome estimates are smoothed with wide intervals; treat as directional until ≥10 terminal runs.</div></div>`;
  return b;
}
function renderFlowBody(){
  const body=document.getElementById("flow-body"); if(!body) return;
  if(!FLOW_TYPE){ body.innerHTML='<div class="empty" style="padding:40px">Enter a workflow type to see its state-transition graph + outcome probabilities.<br><br>The numbers come straight from kova (the same source Forge renders), so both surfaces always agree.</div>'; return; }
  if(FLOW_ERR){ body.innerHTML='<div class="empty" style="padding:40px">'+esc(FLOW_ERR)+'</div>'; return; }
  if(!FLOW_DATA){ body.innerHTML='<div class="empty" style="padding:40px">Loading flow…</div>'; return; }
  const fg=FLOW_DATA;
  const summary = `<div class="cards">`+
    `<div class="card"><div class="k">runs (logical)</div><div class="v">${fg.total_runs||0}</div></div>`+
    `<div class="card"><div class="k">terminal</div><div class="v">${fg.terminal_runs||0}</div></div>`+
    `<div class="card"><div class="k">sample N</div><div class="v">${fg.sample_size||0}</div></div>`+
    `<div class="card"><div class="k">in-flight</div><div class="v">${fg.has_in_flight_runs?"yes":"no"}</div></div></div>`;
  const runId = FLOW_RUN ? FLOW_RUN : undefined;
  // currentState (per-run conditioning + node glow) needs the run's current step,
  // which the type-level Flow tab does not load — so it stays unconditional here
  // (the run-id only fills the exact cancel/resume command). The renderers accept
  // currentState for the export / Forge-parity grammar; Forge does the per-run
  // overlay on its run-detail page (where the run detail is already loaded).
  body.innerHTML = flowBanners(fg) + summary +
    `<div class="section-title">State-transition flow (Markov)</div>`+ markovFlow(fg, undefined) +
    `<div class="section-title">Outcome probability (Bayesian)</div>`+ bayesianPanel(fg, runId, undefined);
}
async function loadFlow(){
  const tEl=document.getElementById("flow-type"), rEl=document.getElementById("flow-run");
  FLOW_TYPE=((tEl&&tEl.value)||"").trim(); FLOW_RUN=((rEl&&rEl.value)||"").trim();
  FLOW_DATA=null; FLOW_ERR="";
  if(!FLOW_TYPE){ renderFlowBody(); return; }
  renderFlowBody();                                  // show "Loading…"
  try{
    const r = await fetch("/api/flow?type="+encodeURIComponent(FLOW_TYPE));
    const j = await r.json().catch(()=>null);
    if(!r.ok || (j&&j.error)) FLOW_ERR = (j&&j.error) || ("kova flow request failed (HTTP "+r.status+")");
    else FLOW_DATA = j;
  }catch(e){ FLOW_ERR = "request failed: "+e; }
  if(VIEW==="flow") renderFlowBody();
}
// Mount-once: build the controls only when absent so the 4s poll's re-render
// never steals focus mid-type; only the result body re-renders (mirrors the
// Terminal tab's mount-once discipline).
function renderFlow(){
  const root=document.getElementById("root");
  if(!document.getElementById("flow-type")){
    root.innerHTML = '<div style="max-width:1180px;margin:0 auto">'+flowControlsHtml()+'<div id="flow-body"></div></div>';
    wireFlow();
  }
  renderFlowBody();
}

/* ---------- metrics (Netdata-backed) ---------- */
// Aggregate a Netdata anomaly-bit body to a single 0–100 rate (mirror of
// netdata.rs::anomaly_rate_from_data: mean of the latest row's dim values).
function anomalyRate(body) {
  const rows = body && body.data;
  if (!Array.isArray(rows) || !rows.length) return null;
  const last = rows[rows.length-1];
  if (!Array.isArray(last) || last.length < 2) return null;
  let sum=0, n=0;
  for (let i=1;i<last.length;i++) if (typeof last[i]==="number") { sum+=last[i]; n++; }
  return n ? sum/n : null;
}
// Latest per-dimension (per-tester) values from a Netdata data body.
function latestDims(body) {
  const labels = (body && body.labels) || [];
  const rows = (body && body.data) || [];
  if (!rows.length) return [];
  const last = rows[rows.length-1], out = [];
  for (let i=1;i<last.length;i++) if (typeof last[i]==="number")
    out.push({ label:String(labels[i]!=null?labels[i]:("dim"+i)), value:last[i] });
  return out;
}
const ribbonColor = r => r==null ? "var(--muted2)" : r>=66 ? C.err : r>=33 ? C.warn : C.ok;
function ribbon(r) { const v = r==null?0:Math.max(0,Math.min(100,r)); return `<div class="ribbon" style="flex:1"><span style="width:${v}%;background:${ribbonColor(r)}"></span></div>`; }
// Recompute the relative query window from absolute run timestamps each render,
// so a deep-linked past window stays correct under live refresh.
function windowQuery() {
  if (METRIC_WINDOW) {
    const now = Date.now();
    const after = Math.min(0, -((now - METRIC_WINDOW.startMs)/1000));
    const before = Math.min(0, -((now - METRIC_WINDOW.endMs)/1000));
    return { after, before, label: METRIC_WINDOW.label };
  }
  return { after:-600, before:0, label:"last 10m" };
}
async function renderMetrics() {
  const root = document.getElementById("root");
  if (!NETDATA.configured) { root.innerHTML = cfgCard(); return; }
  if (!NETDATA.reachable)  { root.innerHTML = unreachableCard(); return; }

  const win = windowQuery();
  const qs = `after=${Math.round(win.after)}&before=${Math.round(win.before)}&points=60`;
  let anomalies = null; const charts = {};
  try {
    const reqs = [ fetch(`/api/anomalies?${qs}`).then(r=>r.ok?r.json():null).catch(()=>null) ];
    for (const c of METRIC_CHARTS)
      reqs.push(fetch(`/api/metrics?chart=${encodeURIComponent(c.id)}&${qs}`).then(r=>r.ok?r.json():null).catch(()=>null));
    const res = await Promise.all(reqs);
    anomalies = res[0];
    METRIC_CHARTS.forEach((c,i)=>{ charts[c.id] = res[i+1]; });
  } catch(e) { /* render whatever we have */ }
  if (VIEW !== "metrics") return;        // user switched tabs mid-fetch
  root.innerHTML = metricsHtml({ anomalies, charts, win });
}
function metricsHtml(M) {
  const nodeRate = anomalyRate(M.anomalies && M.anomalies.node);
  const crit = ALARMS.filter(a=>a.status==="CRITICAL").length;
  const deepBanner = METRIC_WINDOW
    ? `<div class="recover-banner">🔎 <div><b>Scoped to one run's window</b> (${esc(M.win.label)}). Metrics + ML anomaly as kova saw them while this run executed. <a href="#" style="color:var(--accent)" onclick="METRIC_WINDOW=null;renderMetrics();return false">view live (last 10m) →</a></div></div>`
    : "";
  const kpis = `<div class="kpis" style="grid-template-columns:repeat(4,1fr)">
    <div class="kpi"><div class="k">fleet ML anomaly</div><div class="v" style="color:${ribbonColor(nodeRate)}">${nodeRate==null?"—":nodeRate.toFixed(1)+"%"}</div><div class="d">${esc(M.win.label)}</div></div>
    <div class="kpi"><div class="k">active alarms</div><div class="v" style="color:${ALARMS.length?C.warn:C.text}">${ALARMS.length}</div><div class="d">${crit} critical</div></div>
    <div class="kpi"><div class="k">charts</div><div class="v">${METRIC_CHARTS.length}</div><div class="d">prometheus.kova_* via Netdata</div></div>
    <div class="kpi"><div class="k">source</div><div class="v" style="font-size:15px;color:${C.ok}">Netdata</div><div class="d">per-metric ML anomaly</div></div>
  </div>`;
  const panels = METRIC_CHARTS.map(c=>{
    const body = M.charts[c.id];
    const anomBody = M.anomalies && M.anomalies.charts && M.anomalies.charts[c.id];
    const rate = anomalyRate(anomBody);
    const rateTxt = rate==null ? "—" : rate.toFixed(0)+"%";
    if (!body || body.error) {

      return `<div class="panel col-6"><h3>${esc(c.title)} <span class="hint">ML anomaly ${rateTxt}</span></h3>

    }

    const bars = dims.length ? hbars(dims, c.fmt) : '<div class="empty" style="padding:20px">no current samples</div>';
    return `<div class="panel col-6"><h3>${esc(c.title)} <span class="hint">ML anomaly ${rateTxt}</span></h3>
      ${bars}

  }).join("");
  const alarmsPanel = `<div class="panel col-12"><h3>Active alarms <span class="hint">Netdata health</span></h3>${
    ALARMS.length
      ? `<div class="hist">` + ALARMS.map(a=>`<div class="hrow" style="grid-template-columns:96px 1fr 110px">
          <span class="pill" style="background:${a.status==="CRITICAL"?"rgba(239,68,68,.18)":"rgba(245,158,11,.18)"};color:${a.status==="CRITICAL"?C.err:C.warn}">${esc(a.status)}</span>
          <span class="lab"><b>${esc(a.name)}</b> <span style="color:var(--muted)">${esc(a.info)}</span></span>
          <span class="tok">${a.value!=null?esc(String(a.value)):""}</span></div>`).join("") + `</div>`
      : '<div class="empty" style="padding:26px">No active alarms.</div>'
  }</div>`;
  return `${deepBanner}${kpis}<div class="grid">${panels}${alarmsPanel}</div>`;
}

/* ---------- terminal (kova control console) ----------
   A Ghostty-styled command console, NOT a PTY: the user types whitelisted kova
   verbs and Lumen proxies each to kova's REST API (POST /api/console), with the
   API key held server-side. Mount-once so the 4s poll never wipes scrollback. */
function renderTerminal() {
  const root = document.getElementById("root");
  if (!KOVA.loaded) {                       // probe reachability once, then re-render
    fetch("/api/kova-status").then(r=>r.json())
      .then(j=>{ KOVA = {configured:!!j.configured, reachable:!!j.reachable, loaded:true}; if (VIEW==="terminal") renderTerminal(); })
      .catch(()=>{ KOVA = {configured:false, reachable:false, loaded:true}; if (VIEW==="terminal") renderTerminal(); });
    root.innerHTML = `<div class="empty">Connecting to Kova…</div>`;
    return;
  }
  if (!KOVA.configured) { root.innerHTML = kovaCfgCard(); return; }
  if (document.getElementById("term")) return;   // mount-once: keep scrollback + focus
  const ok = KOVA.reachable;
  root.innerHTML = `<div class="term" id="term">
    <div class="term-bar"><span class="dot" style="background:${ok?C.ok:C.warn}"></span>
      <span>kova control console</span>
      <span class="right">${ok?"connected":"configured · unreachable"} · type <b>help</b> · ↑↓ history · ⇥ complete</span></div>
    <div class="term-out" id="termout"></div>
    <div class="term-line" onclick="document.getElementById('terminput').focus()">
      <span class="pr">kova❯</span>
      <input id="terminput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${ok?'agents':'(kova unreachable — commands will fail until it responds)'}">
    </div></div>`;
  const inp = document.getElementById("terminput");
  inp.addEventListener("keydown", termKey);
  termAppend("muted", ok
    ? "Connected. Read verbs are safe; mutations change state; destructive verbs ask to confirm. `help` for the full list."
    : "Kova is configured but not responding yet. Commands will fail with ✗ until it comes back. `help` still works.");
  inp.focus();
}
function kovaCfgCard() {
  return `<div class="cfgcard">
    <h3>🖥️ Terminal — connect Kova</h3>
    <p class="muted">Drive a running Kova from here: inspect agents / workflows / traces and run safe control verbs. Lumen proxies each command to Kova's REST API and holds the API key <b>server-side</b> — the browser never sees it. This is a kova-REST <b>command console</b>, not a shell (no PTY).</p>
    <p>Restart the dashboard pointed at your Kova:</p>
    <p><code>lumen dashboard --kova-url http://localhost:3010 --api-key sk-kova-…</code></p>
    <p class="muted">…or set <code>LUMEN_KOVA_URL</code> + <code>LUMEN_KOVA_API_KEY</code>. Over Tailscale use <code>http://100.122.83.20:3010</code>.</p>
    <p class="muted">Read verbs need no LLM; agent <i>runs</i> need a working LLM key on Kova. Destructive verbs (reset / terminate / delete) require an explicit confirm.</p>
  </div>`;
}
// Append a scrollback line. textContent (not innerHTML) keeps every kova-derived
// string inert — no HTML/JS interpretation, stronger than esc() for this surface.
function termAppend(kind, text, wrap) {
  const o = document.getElementById("termout"); if (!o) return;
  const d = document.createElement("div");
  d.className = "term-" + kind + (wrap ? " wrap" : "");
  d.textContent = text;
  o.appendChild(d); o.scrollTop = o.scrollHeight;
}
function termEcho(cmd){ termAppend("echo", cmd); }
async function postConsole(line, confirm) {
  try {
    const r = await fetch("/api/console", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({line, confirm})});
    return await r.json();
  } catch(e) { return {kind:"error", text:"dashboard request failed: " + e}; }
}
function termShow(j) {
  if (j.kind === "error")  termAppend("error", j.text, true);
  else if (j.kind === "config") termAppend("muted", j.text, true);
  else termAppend("output", j.text || "(ok)");
}
async function termSubmit() {
  const inp = document.getElementById("terminput"); if (!inp) return;
  const val = inp.value; inp.value = "";
  const v = val.trim();
  // Confirm flow: a prior destructive command is pending.
  if (TERM_PENDING) {
    const pending = TERM_PENDING; TERM_PENDING = null;
    if (v === "" || v.toLowerCase() === "y" || v.toLowerCase() === "yes") {
      termAppend("muted", "confirmed.");
      termShow(await postConsole(pending, true));
      return;
    }
    termAppend("muted", "cancelled.");
    // fall through: treat v as a fresh command
  }
  if (v === "") return;
  TERM_HIST.push(v); TERM_HISTI = TERM_HIST.length;
  termEcho(v);
  if (v === "clear") { document.getElementById("termout").innerHTML = ""; return; }
  const j = await postConsole(v, false);
  if (j.kind === "confirm") {
    TERM_PENDING = v;
    termAppend("confirm", j.text, true);
    termAppend("muted", "press ⏎ again (or type y) to confirm · anything else cancels");
    return;
  }
  termShow(j);
}
function termKey(e) {
  const inp = e.target;
  if (e.key === "Enter") { e.preventDefault(); termSubmit(); }
  else if (e.key === "ArrowUp")   { e.preventDefault(); if (TERM_HIST.length) { TERM_HISTI = Math.max(0, TERM_HISTI-1); inp.value = TERM_HIST[TERM_HISTI] || ""; } }
  else if (e.key === "ArrowDown") { e.preventDefault(); if (TERM_HIST.length) { TERM_HISTI = Math.min(TERM_HIST.length, TERM_HISTI+1); inp.value = TERM_HIST[TERM_HISTI] || ""; } }
  else if (e.key === "Tab")       { e.preventDefault(); termComplete(inp); }
}
// Tab-completion for the first token (the verb) against KOVA_VERBS.
function termComplete(inp) {
  const v = inp.value;
  if (v.includes(" ")) return;            // only complete the leading verb
  const m = KOVA_VERBS.filter(x => x.startsWith(v));
  if (m.length === 1) inp.value = m[0] + (m[0]==="help" || m[0]==="clear" ? "" : " ");
  else if (m.length > 1) termAppend("muted", m.join("  "));
}
